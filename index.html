<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TAXI DJ">
<meta name="theme-color" content="#ffcc00">
<link rel="manifest" href="./manifest.json?v=13">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=13">
<link rel="icon" href="./icons/icon-192.png?v=13">
<title>TAXI DJ v13</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+KR:wght@500;700&display=swap');
*{font-family:'Inter','Noto Sans KR',system-ui,-apple-system,sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;min-height:100vh}
button{border:none;background:none;cursor:pointer;font:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:#080808;z-index:20}
header b{font-size:20px;font-weight:800;letter-spacing:-0.02em}
#gear{width:40px;height:40px;border-radius:50%;background:#151515;border:1px solid #222;display:flex;align-items:center;justify-content:center}
#tabs{display:flex;border-bottom:1px solid #1e1e1e}
.tab{flex:1;height:48px;font-size:13px;color:#5a5a5a;font-weight:700}
.tab.on{color:#ffcc00;border-bottom:2px solid #ffcc00}
main{flex:1;padding:16px 16px 120px}
.card{background:#151515;border:1px solid #1e1e1e;border-radius:14px}
.btn-offline{width:100%;height:72px;background:#151515;border:2px solid #ffcc00;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.btn-add{width:100%;height:56px;border:1px dashed #2a2a2a;border-radius:14px;color:#666;font-size:14px;margin-top:12px}
.file{height:52px;background:#151515;border-radius:12px;display:flex;align-items:center;padding:0 12px;gap:12px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preset{min-height:108px;background:#151515;border-radius:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;text-align:left}
#player{position:fixed;bottom:0;left:0;right:0;background:#151515;border-top:1px solid #222;padding:12px 16px;display:flex;gap:12px;align-items:center;z-index:30}
#player audio{height:32px;width:200px}
#settings{position:fixed;inset:0;z-index:50;display:none}
#settings.on{display:flex;align-items:flex-end;justify-content:center}
#settings .bg{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(2px)}
#settings .box{position:relative;width:100%;max-width:480px;background:#121212;border:1px solid #222;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}
@media(min-width:480px){#settings .box{border-radius:20px}}
.hist{padding:16px;border-radius:14px;margin-bottom:8px;border:1px solid #1e1e1e;background:#151515}
.hist.v13{background:#181500;border-color:#ffcc00}
</style>
</head>
<body>
<div id="app">
<header><b>TAXI DJ</b><button id="gear">⚙︎</button></header>
<div id="tabs">
<button class="tab on" data-tab="보관함">보관함</button>
<button class="tab" data-tab="YT뮤직">YT뮤직</button>
<button class="tab" data-tab="롱믹스">롱믹스</button>
<button class="tab" data-tab="히스토리">히스토리</button>
</div>
<main id="main"></main>
<div id="player" style="display:none"><div style="flex:1;min-width:0"><div style="font-size:11px;color:#777">재생 중</div><div id="pname" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div><audio id="audio" controls></audio><button id="pclose" style="width:32px;height:32px;color:#666">✕</button></div>
<div id="settings"><div class="bg"></div><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><b>프리셋 편집</b><button id="sclose" style="width:32px;height:32px;border-radius:50%;background:#1e1e1e;color:#777">✕</button></div><div id="slist"></div><p style="margin-top:16px;font-size:11px;color:#444">모든 열기는 https 유니버설 링크만 사용. 커스텀 스킴 없음. 팝업 차단 없음.</p></div></div>
</div>
<script>
const PRESETS=[
{id:'1',emoji:'🔥',label:'20대 팝송',query:'20대 인기 팝송 모음'},
{id:'2',emoji:'📻',label:'4050 가요',query:'4050 추억의 가요 메들리'},
{id:'3',emoji:'🎤',label:'트로트',query:'7080 트로트 메들리'},
{id:'4',emoji:'🌧️',label:'비오는날',query:'비오는날 잔잔한 발라드'},
{id:'5',emoji:'☕',label:'밤 재즈',query:'밤에 듣기좋은 카페 재즈'},
{id:'6',emoji:'🚕',label:'신나는',query:'운전할때 신나는 댄스곡'},
];
let presets=JSON.parse(localStorage.getItem('taxi-presets')||'null')||PRESETS;
let tab='보관함';
let files=[];
let playing=null;
let playingUrl=null;
function openDB(){
return new Promise((res,rej)=>{
const r=indexedDB.open('taxi-dj',1);
r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files',{keyPath:'id',autoIncrement:true})};
r.onsuccess=()=>res(r.result);
r.onerror=()=>rej(r.error);
});
}
async function loadFiles(){
const d=await openDB();const tx=d.transaction('files','readonly');const req=tx.objectStore('files').getAll();req.onsuccess=()=>{files=req.result;render();};
}
async function addFiles(list){
const d=await openDB();const tx=d.transaction('files','readwrite');const st=tx.objectStore('files');
for(const f of list){if(!f.type.startsWith('audio/'))continue; st.add({name:f.name,blob:f});}
tx.oncomplete=()=>loadFiles();
}
async function delFile(id){
const d=await openDB();const tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{if(playing&&playing.id===id){stop();}loadFiles();};
}
function playFile(f){
if(playingUrl) URL.revokeObjectURL(playingUrl);
playingUrl=URL.createObjectURL(f.blob);
playing=f;
document.getElementById('pname').textContent=f.name;
document.getElementById('player').style.display='flex';
const a=document.getElementById('audio');a.src=playingUrl;a.play().catch(()=>{});
render();
}
function stop(){const a=document.getElementById('audio');a.pause();if(playingUrl) URL.revokeObjectURL(playingUrl);playingUrl=null;playing=null;document.getElementById('player').style.display='none';render();}
function openOffline(){window.open('https://www.youtube.com/feed/library','_blank');}
function openYTM(q){window.open('https://music.youtube.com/search?q='+encodeURIComponent(q),'_blank');}
function openLong(q){window.open('https://m.youtube.com/results?search_query='+encodeURIComponent(q+' 10시간'),'_blank');}
function render(){
const main=document.getElementById('main');
if(tab==='보관함'){
main.innerHTML=`
<button class="btn-offline" id="btnOff"><span style="font-weight:700;font-size:15px">유튜브 오프라인 보관함</span><span style="color:#ffcc00;font-weight:700;font-size:14px">열기</span></button>
<button class="btn-add" id="btnAdd">+ 파일 추가</button>
<input id="finput" type="file" accept="audio/*" multiple style="display:none">
${files.length===0?`<div style="padding:40px 0;text-align:center;color:#3a3a3a;font-size:13px">추가된 파일 없음</div>`:`
<div style="margin-top:12px">${files.map(f=>`
<div class="file"><button data-play="${f.id}" style="width:32px;height:32px;border-radius:50%;background:${playing&&playing.id===f.id?'#ffcc00':'#222'};color:${playing&&playing.id===f.id?'#000':'#fff'}">${playing&&playing.id===f.id?'■':'▶'}</button><div style="flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name}</div><button data-del="${f.id}" style="color:#444">✕</button></div>`).join('')}</div>`}
`;
document.getElementById('btnOff').onclick=openOffline;
document.getElementById('btnAdd').onclick=()=>document.getElementById('finput').click();
document.getElementById('finput').onchange=e=>{if(e.target.files) addFiles(e.target.files); e.target.value='';};
main.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const f=files.find(x=>x.id==b.dataset.play);if(playing&&playing.id==f.id) stop(); else playFile(f);});
main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delFile(Number(b.dataset.del)));
}
else if(tab==='YT뮤직'){
main.innerHTML=`<div class="grid2">${presets.map(p=>`<button class="preset" data-ytm="${p.id}"><span style="font-size:28px">${p.emoji}</span><span style="font-weight:700;font-size:14px">${p.label}</span></button>`).join('')}</div>`;
main.querySelectorAll('[data-ytm]').forEach(b=>b.onclick=()=>{const p=presets.find(x=>x.id==b.dataset.ytm);openYTM(p.query);});
}
else if(tab==='롱믹스'){
main.innerHTML=`<div class="grid2">${presets.map(p=>`<button class="preset" data-long="${p.id}"><span style="font-size:28px">${p.emoji}</span><div><div style="font-weight:700;font-size:14px">${p.label}</div><div style="font-size:11px;color:#666">롱믹스</div></div></button>`).join('')}</div>`;
main.querySelectorAll('[data-long]').forEach(b=>b.onclick=()=>{const p=presets.find(x=>x.id==b.dataset.long);openLong(p.query);});
}
else if(tab==='히스토리'){
const hist=[
{v:'v13',title:'팝업 없이 앱으로 열기 최종',desc:'https 유니버설 링크만 사용, 커스텀 스킴 제거, 사파리 팝업 차단 해결',date:'2026-09-26'},
{v:'v12',title:'앱 스킴 시도',desc:'youtubemusic:// 시도했으나 사파리 팝업 발생',date:'2026-09-26'},
{v:'v11',title:'심플 + 앱 바로열기 수정',desc:'심플 버전 베이스, IndexedDB 유지',date:'2026-09-26'},
{v:'v6',title:'클린 미니멀 베이스',desc:'불필요 카드 제거, 노란 포인트',date:'2026-09-26'},
{v:'v4',title:'설명 카드 버전',desc:'DRM 설명 등 덕지덕지',date:'2026-09-26'},
];
main.innerHTML=hist.map(h=>`<div class="hist ${h.v==='v13'?'v13':''}"><div style="display:flex;justify-content:space-between"><b style="font-size:12px;color:${h.v==='v13'?'#ffcc00':'#555'}">${h.v}</b><span style="font-size:11px;color:#444">${h.date}</span></div><div style="margin-top:4px;font-weight:700;font-size:14px">${h.title}</div><div style="margin-top:4px;font-size:12px;color:#666">${h.desc}</div></div>`).join('');
}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');tab=t.dataset.tab;render();});
document.getElementById('gear').onclick=()=>{document.getElementById('settings').classList.add('on');renderSettings();};
document.getElementById('sclose').onclick=()=>document.getElementById('settings').classList.remove('on');
document.querySelector('#settings .bg').onclick=()=>document.getElementById('settings').classList.remove('on');
document.getElementById('pclose').onclick=stop;
function renderSettings(){
const sl=document.getElementById('slist');
sl.innerHTML=presets.map(p=>`
<div style="background:#151515;border-radius:12px;padding:12px;display:flex;gap:8px;margin-bottom:8px">
<span style="font-size:20px;width:28px;text-align:center">${p.emoji}</span>
<div style="flex:1;display:flex;flex-direction:column;gap:8px">
<input data-label="${p.id}" value="${p.label}" placeholder="라벨" style="height:36px;background:#0e0e0e;border:1px solid #222;border-radius:8px;padding:0 12px;color:#fff;font-size:13px">
<input data-query="${p.id}" value="${p.query}" placeholder="검색어" style="height:36px;background:#0e0e0e;border:1px solid #222;border-radius:8px;padding:0 12px;color:#aaa;font-size:13px">
</div></div>`).join('');
sl.querySelectorAll('[data-label]').forEach(i=>i.oninput=e=>{presets=presets.map(x=>x.id==e.target.dataset.label?{...x,label:e.target.value}:x);localStorage.setItem('taxi-presets',JSON.stringify(presets));render();});
sl.querySelectorAll('[data-query]').forEach(i=>i.oninput=e=>{presets=presets.map(x=>x.id==e.target.dataset.query?{...x,query:e.target.value}:x);localStorage.setItem('taxi-presets',JSON.stringify(presets));});
}
loadFiles();render();
</script>
</body>
</html>

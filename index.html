<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TAXI DJ</title>

  <!-- PWA & iOS 홈 화면 아이콘 설정 (Point 4 해결) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TAXI DJ">
  <meta name="theme-color" content="#080808">

  <style>
    *,:after,:before{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;box-sizing:border-box;border:0 solid #e5e7eb}
    html,body{margin:0;padding:0;width:100%;height:100%;background-color:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
    .container{max-width:480px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:20px}
    .header{text-align:center;margin-bottom:10px}
    .title{font-size:28px;font-weight:800;color:#ffcc00;margin:0;letter-spacing:-0.02em}
    .subtitle{font-size:13px;color:#8a8a8a;margin-top:4px}
    .card-grid{display:grid;grid-template-columns:1fr;gap:14px}
    .btn{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background-color:#121212;border:1px solid #222;border-radius:16px;color:#fff;text-decoration:none;font-size:16px;font-weight:700;transition:all 0.15s ease}
    .btn:active{transform:scale(0.98);background-color:#1a1a1a}
    .btn-yt{border-color:#ff0000;color:#ff4e4e}
    .btn-ytm{border-color:#ffcc00;color:#ffcc00}
    .icon{width:24px;height:24px;fill:currentColor}
    .search-box{margin-top:10px;background:#121212;padding:16px;border-radius:16px;border:1px solid #222}
    .input-group{display:flex;gap:8px;margin-top:10px}
    input[type="text"]{flex:1;background:#080808;border:1px solid #333;padding:12px;border-radius:10px;color:#fff;font-size:15px;outline:none}
    input[type="text"]:focus{border-color:#ffcc00}
    .btn-search{background:#ffcc00;color:#000;border:none;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px}
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">TAXI DJ</h1>
      <p class="subtitle">빠른 앱 실행 & 오프라인 보관함 바로가기</p>
    </div>

    <div class="card-grid">
      <!-- 1. 유튜브 오프라인 보관함 바로가기 (Point 1, 3 적용) -->
      <button class="btn btn-yt" onclick="openYouTubeOffline()">
        <span>유튜브 오프라인 보관함</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </button>

      <!-- 2. YT Music 바로 열기 (Point 2, 3 적용) -->
      <button class="btn btn-ytm" onclick="openYTMusic()">
        <span>YT Music 실행</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.2c-3.972 0-7.2-3.228-7.2-7.2s3.228-7.2 7.2-7.2 7.2 3.228 7.2 7.2-3.228 7.2-7.2 7.2zm0-11.4c-2.316 0-4.2 1.884-4.2 4.2s1.884 4.2 4.2 4.2 4.2-1.884 4.2-4.2-1.884-4.2-4.2-4.2zm0 6c-0.996 0-1.8-0.804-1.8-1.8s0.804-1.8 1.8-1.8 1.8 0.804 1.8 1.8-0.804 1.8-1.8 1.8z"/></svg>
      </button>
    </div>

    <!-- YT Music 바로 검색 -->
    <div class="search-box">
      <div style="font-size:14px; font-weight:700; color:#ffcc00;">YT Music 빠른 검색</div>
      <div class="input-group">
        <input type="text" id="ytmQuery" placeholder="검색어 입력 (예: 신나는 음악)" onkeyup="if(event.key==='Enter') searchYTMusic()">
        <button class="btn-search" onclick="searchYTMusic()">검색</button>
      </div>
    </div>
  </div>

  <script>
    // Point 1 & 3: 유튜브 오프라인 보관함 딥링크 (별도 웹 안내창 없이 즉시 이동)
    function openYouTubeOffline() {
      // iOS 최신 유튜브 앱 대응 오프라인 보관함 스킴
      const ytScheme = "youtube://www.youtube.com/feed/downloads";
      const webFallback = "https://www.youtube.com/feed/downloads";
      
      const start = Date.now();
      window.location.href = ytScheme;

      // 앱이 설치되어 있지 않거나 열리지 않을 경우 웹 보관함으로 연결
      setTimeout(function() {
        if (Date.now() - start < 2000) {
          window.location.href = webFallback;
        }
      }, 1200);
    }

    // Point 2 & 3: YT Music 앱 즉시 실행
    function openYTMusic() {
      window.location.href = "youtubemusic://";
    }

    // Point 2: YT Music 검색 탭 실행
    function searchYTMusic() {
      const query = document.getElementById("ytmQuery").value.trim();
      if (query) {
        window.location.href = "youtubemusic://search?q=" + encodeURIComponent(query);
      } else {
        window.location.href = "youtubemusic://search";
      }
    }
  </script>
</body>
</html>

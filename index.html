<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TAXI DJ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffcc00">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>TAXI DJ v24 - icon set</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+KR:wght@500;700&display=swap');
:root{--bg:#121212;--card:#1e1e1e;--card-border:#2a2a2a;--text:#fff;--dim:#999;--dim2:#666;--yellow:#ffcc00}
[data-theme="light"]{--bg:#F5F5F5;--card:#FFFFFF;--card-border:#E8E8E8;--text:#111;--dim:#888;--dim2:#AAA}
*{font-family:'Inter','Noto Sans KR',system-ui,sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:.2s;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{border:none;background:none;cursor:pointer;font:inherit;-webkit-tap-highlight-color:transparent}
input{background:var(--bg);border:1px solid var(--card-border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;width:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{height:calc(64px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--card-border)}
#hbtns{display:flex;gap:10px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:18px}
#tabs{display:flex;border-bottom:1px solid var(--card-border);background:var(--bg);position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:19}
.tab{flex:1;height:48px;font-size:13px;color:var(--dim);font-weight:700;position:relative}
.tab.on{color:var(--text)} .tab.on::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--yellow);border-radius:2px}
main{flex:1;padding:16px 16px 120px}
.btn-offline{width:100%;height:72px;background:var(--card);border:2px solid var(--yellow);border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.btn-add{width:100%;height:56px;border:1px dashed var(--card-border);border-radius:14px;color:var(--dim);font-size:14px;margin-top:12px;background:var(--card);font-weight:600}
.file{height:52px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;display:flex;align-items:center;padding:0 12px;gap:12px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preset{min-height:108px;background:var(--card);border-radius:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;text-align:left;border:1px solid var(--card-border)}
.preset b{font-size:14px;font-weight:700}
#player{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card-border);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;z-index:30}
#settings{position:fixed;inset:0;z-index:50;display:none}
#settings.on{display:flex;align-items:flex-end;justify-content:center}
#settings .bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
#settings .box{position:relative;width:100%;max-width:480px;background:var(--card);border:1px solid var(--card-border);border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.srow{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--card-border);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.vhist{padding:14px;border-radius:12px;margin-bottom:10px;border:1px solid var(--card-border);background:var(--card)}
.vhist.now{border-color:var(--yellow)}
.vhist p{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5;white-space:pre-wrap}
/* 아이콘 피커 */
#iconPicker{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center}
#iconPicker.on{display:flex}
#iconPicker .bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
#iconPicker .box{position:relative;width:100%;max-width:480px;background:var(--card);border:1px solid var(--card-border);border-radius:20px 20px 0 0;padding:20px;max-height:70vh;overflow:auto}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
.icon-opt{height:48px;border-radius:12px;background:var(--bg);border:1px solid var(--card-border);font-size:22px;display:flex;align-items:center;justify-content:center}
.icon-opt.sel{border-color:var(--yellow);background:rgba(255,204,0,.15)}
.emoji-btn{width:44px;height:44px;border-radius:10px;background:var(--card);border:1px solid var(--card-border);font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
<header><b>TAXI DJ</b><div id="hbtns"><button class="iconbtn" id="themeBtn">🌙</button><button class="iconbtn" id="gear">⚙︎</button></div></header>
<div id="tabs"><button class="tab on" data-tab="보관함">보관함</button><button class="tab" data-tab="YT뮤직">YT뮤직</button><button class="tab" data-tab="롱믹스">롱믹스</button><button class="tab" data-tab="히스토리">히스토리</button></div>
<main id="main"></main>
<div id="player" style="display:none"><div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--dim)">재생 중</div><div id="pname" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600"></div></div><audio id="audio" controls style="height:32px;width:200px"></audio><button id="pclose" style="width:32px;height:32px;color:var(--dim)">✕</button></div>

<div id="settings"><div class="bg"></div><div class="box">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><b style="font-size:16px">설정 - 프리셋 편집</b><button id="sclose" style="width:32px;height:32px;border-radius:50%;background:var(--bg);color:var(--dim);border:1px solid var(--card-border)">✕</button></div>
<div id="slist"></div>
<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--card-border)">
<div style="font-size:12px;font-weight:700;color:var(--dim);margin-bottom:8px">새 프리셋 추가</div>
<div style="display:flex;gap:8px;align-items:center">
<button class="emoji-btn" id="newEmojiBtn">🎵</button>
<input id="newLabel" placeholder="이름 (예: 90년대)">
<input id="newQuery" placeholder="검색어">
</div>
</div>
<button id="addPreset" style="width:100%;height:44px;background:var(--yellow);color:#000;border-radius:12px;font-weight:800;font-size:13px;margin-top:8px">+ 프리셋 추가</button>
</div></div>

<div id="iconPicker"><div class="bg"></div><div class="box">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">아이콘 선택</b><button id="iconClose" style="width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--card-border)">✕</button></div>
<div class="icon-grid" id="iconGrid"></div>
</div></div>

</div>
<script>
const ICONS=['🔥','📻','🎤','🌧️','☕','🚕','🎄','👶','⚽','🎃','🎅','💃','🕺','🎸','🎹','🎷','💕','🌙','⭐','🎧','🎵','🎶','🚗','✈️','🏖️','🍺','🍷','🎂','🎉','💿','📀','🎬','🌈','🌸','❤️','💛'];
const DEFAULT_PRESETS=[
{id:'1',emoji:'🔥',label:'20대 팝송',query:'20대 인기 팝송 모음'},
{id:'2',emoji:'📻',label:'4050 가요',query:'4050 추억의 가요 메들리'},
{id:'3',emoji:'🎤',label:'트로트',query:'7080 트로트 메들리'},
{id:'4',emoji:'🌧️',label:'비오는날',query:'비오는날 잔잔한 발라드'},
{id:'5',emoji:'☕',label:'밤 재즈',query:'밤에 듣기좋은 카페 재즈'},
{id:'6',emoji:'🚕',label:'신나는',query:'운전할때 신나는 댄스곡'},
];
const VERSIONS=[
{ver:'v24',date:'2026-09-26',title:'아이콘 세트 선택 추가',desc:'• 프리셋 앞에 이모지 36개 세트 선택 가능\n• 설정에서 아이콘 버튼 클릭 -> 아이콘 피커 팝업\n• 새 프리셋 추가 시에도 아이콘 선택'},
{ver:'v23',date:'2026-09-26',title:'설정 = 프리셋 편집 원복',desc:'• 설정 = 프리셋 편집\n• 주간/야간은 헤더 달 버튼'},
{ver:'v22',date:'2026-09-26',title:'히스토리 전체 누적',desc:'• v1~v22 전체 보이게'},
{ver:'v21',date:'2026-09-26',title:'PWA 노치 터치 수정',desc:'• safe-area 적용'},
{ver:'v20',date:'2026-09-26',title:'아이콘 고정 + 보관함',desc:'• feed/library\n• 팝업 0개'},
{ver:'v13',date:'2026-09-25',title:'디자인 규격 확정',desc:'• 108px 카드'},
{ver:'v1',date:'2026-09-23',title:'최초 버전',desc:'• TAXI DJ 시작'},
];
let presets=JSON.parse(localStorage.getItem('taxi-presets')||'null')||DEFAULT_PRESETS;
let theme=localStorage.getItem('taxi-theme')||'dark';let tab='보관함';let files=[];let playing=null;let playingUrl=null;
let pickingFor=null; // 'new' or preset id
let tempNewEmoji='🎵';

function savePresets(){localStorage.setItem('taxi-presets',JSON.stringify(presets));render();renderSettings();}
function applyTheme(t){theme=t;localStorage.setItem('taxi-theme',t);document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'🌙':'☀️';}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('taxi-dj',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function loadFiles(){const d=await openDB();const tx=d.transaction('files','readonly');const req=tx.objectStore('files').getAll();req.onsuccess=()=>{files=req.result;render();};}
async function addFiles(list){const d=await openDB();const tx=d.transaction('files','readwrite');const st=tx.objectStore('files');for(const f of list){if(!f.type.startsWith('audio/'))continue;st.add({name:f.name,blob:f});}tx.oncomplete=()=>loadFiles();}
async function delFile(id){const d=await openDB();const tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{if(playing&&playing.id===id)stop();loadFiles();};}
function playFile(f){if(playingUrl)URL.revokeObjectURL(playingUrl);playingUrl=URL.createObjectURL(f.blob);playing=f;document.getElementById('pname').textContent=f.name;document.getElementById('player').style.display='flex';const a=document.getElementById('audio');a.src=playingUrl;a.play().catch(()=>{});render();}
function stop(){document.getElementById('audio').pause();if(playingUrl)URL.revokeObjectURL(playingUrl);playingUrl=null;playing=null;document.getElementById('player').style.display='none';render();}
function openUniversal(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);}
function openLibrary(){openUniversal('https://www.youtube.com/feed/library');}
function openYTM(q){openUniversal('https://music.youtube.com/search?q='+encodeURIComponent(q));}
function openLong(q){openUniversal('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' 10시간'));}
function render(){
const main=document.getElementById('main');
if(tab==='보관함'){
main.innerHTML=`<button class="btn-offline" id="btnLib"><span style="font-weight:700;font-size:15px">유튜브 보관함 열기</span><span style="color:var(--yellow);font-weight:800;font-size:14px">앱에서 열기 →</span></button><button class="btn-add" id="btnAdd">+ 파일 추가</button><input id="finput" type="file" accept="audio/*" multiple style="display:none">${files.length===0?`<div style="padding:40px 0;text-align:center;color:var(--dim2);font-size:13px">보관함은 사진 속 화면까지만 열림</div>`:`<div style="margin-top:12px">${files.map(f=>`<div class="file"><button data-play="${f.id}" style="width:32px;height:32px;border-radius:50%;background:${playing&&playing.id===f.id?'var(--yellow)':'var(--card-border)'}">${playing&&playing.id===f.id?'■':'▶'}</button><div style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div><button data-del="${f.id}">✕</button></div>`).join('')}</div>`}`;
document.getElementById('btnLib').onclick=openLibrary;
document.getElementById('btnAdd').onclick=()=>document.getElementById('finput').click();
document.getElementById('finput').onchange=e=>{if(e.target.files)addFiles(e.target.files);e.target.value='';};
main.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const f=files.find(x=>x.id==b.dataset.play);if(playing&&playing.id==f.id)stop();else playFile(f);});
main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delFile(Number(b.dataset.del)));
}else if(tab==='YT뮤직'){
main.innerHTML=`<div class="grid2">${presets.map(p=>`<button class="preset" data-ytm="${p.id}"><span style="font-size:28px">${p.emoji}</span><b>${p.label}</b></button>`).join('')}</div>`;
main.querySelectorAll('[data-ytm]').forEach(b=>b.onclick=()=>{const p=presets.find(x=>x.id==b.dataset.ytm);openYTM(p.query);});
}else if(tab==='롱믹스'){
main.innerHTML=`<div class="grid2">${presets.map(p=>`<button class="preset" data-long="${p.id}"><span style="font-size:28px">${p.emoji}</span><div><b>${p.label}</b><div style="font-size:11px;color:var(--dim)">롱믹스</div></div></button>`).join('')}</div>`;
main.querySelectorAll('[data-long]').forEach(b=>b.onclick=()=>{const p=presets.find(x=>x.id==b.dataset.long);openLong(p.query);});
}else if(tab==='히스토리'){
main.innerHTML=VERSIONS.map((v,i)=>`<div class="vhist ${i===0?'now':''}"><div style="display:flex;justify-content:space-between"><b style="color:var(--yellow)">${v.ver}</b><span style="font-size:11px;color:var(--dim2)">${v.date}</span></div><div style="margin-top:4px;font-weight:700;font-size:13px">${v.title}</div><p>${v.desc}</p></div>`).join('');
}
}
function renderSettings(){
const sl=document.getElementById('slist');
sl.innerHTML=presets.map(p=>`
<div class="srow">
<button class="emoji-btn" data-emoji="${p.id}" style="font-size:20px">${p.emoji}</button>
<input data-id="${p.id}" data-k="label" value="${p.label}" style="flex:1">
<input data-id="${p.id}" data-k="query" value="${p.query}" style="flex:2">
<button data-delp="${p.id}" style="color:#ff5555;font-size:12px">삭제</button>
</div>`).join('');
sl.querySelectorAll('input[data-id]').forEach(inp=>{inp.onchange=()=>{const pr=presets.find(x=>x.id==inp.dataset.id);pr[inp.dataset.k]=inp.value;savePresets();}});
sl.querySelectorAll('[data-delp]').forEach(b=>{b.onclick=()=>{presets=presets.filter(x=>x.id!=b.dataset.delp);savePresets();}});
sl.querySelectorAll('[data-emoji]').forEach(b=>{
 b.onclick=()=>{
  pickingFor=b.dataset.emoji;
  document.getElementById('iconPicker').classList.add('on');
  buildIconGrid();
 }
});
document.getElementById('newEmojiBtn').textContent=tempNewEmoji;
}
function buildIconGrid(){
 const grid=document.getElementById('iconGrid');
 grid.innerHTML=ICONS.map(ic=>`<button class="icon-opt" data-ic="${ic}">${ic}</button>`).join('');
 grid.querySelectorAll('[data-ic]').forEach(btn=>{
  btn.onclick=()=>{
   if(pickingFor==='new'){
     tempNewEmoji=btn.dataset.ic;
     document.getElementById('newEmojiBtn').textContent=tempNewEmoji;
   } else {
     const pr=presets.find(x=>x.id==pickingFor);
     if(pr){pr.emoji=btn.dataset.ic; savePresets();}
   }
   document.getElementById('iconPicker').classList.remove('on');
  };
 });
}

document.getElementById('newEmojiBtn').onclick=()=>{
 pickingFor='new';
 document.getElementById('iconPicker').classList.add('on');
 buildIconGrid();
};
document.getElementById('addPreset').onclick=()=>{
const l=document.getElementById('newLabel').value;
const q=document.getElementById('newQuery').value;
if(!l||!q) return alert('이름과 검색어 입력');
presets.push({id:Date.now().toString(),emoji:tempNewEmoji,label:l,query:q});
document.getElementById('newLabel').value='';document.getElementById('newQuery').value='';
tempNewEmoji='🎵';
savePresets();
};
document.getElementById('iconClose').onclick=()=>document.getElementById('iconPicker').classList.remove('on');
document.querySelector('#iconPicker .bg').onclick=()=>document.getElementById('iconPicker').classList.remove('on');

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');tab=t.dataset.tab;render();});
document.getElementById('gear').onclick=()=>{renderSettings();document.getElementById('settings').classList.add('on');};
document.getElementById('themeBtn').onclick=()=>applyTheme(theme==='dark'?'light':'dark');
document.getElementById('sclose').onclick=()=>document.getElementById('settings').classList.remove('on');
document.querySelector('#settings .bg').onclick=()=>document.getElementById('settings').classList.remove('on');
document.getElementById('pclose').onclick=stop;
applyTheme(theme);loadFiles();render();
</script>
</body>
</html>
